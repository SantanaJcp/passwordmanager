[workspace]
members = [
    "crates/pm-cli",
    "crates/pm-crypto",
    "crates/pm-custody",
    "crates/pm-native-channel",
    "crates/pm-process-runner",
    "crates/pm-sync",
    "crates/pm-vault",
    "crates/pm-interface",
    "crates/pm-web-auth",
    "crates/pm-ssh-client",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "AGPL-3.0-only"
repository = "https://github.com/SantanaJcp/passwordmanager"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[workspace.dependencies]
aws-lc-rs = "=1.18.1"
base64 = "=0.23.1"
libc = "=0.2.189"
libsodium-sys-stable = { version = "=1.24.0", default-features = false }
minicbor = { version = "=2.3.0", features = ["std"] }
pm-crypto = { path = "crates/pm-crypto" }
pm-custody = { path = "crates/pm-custody" }
pm-native-channel = { path = "crates/pm-native-channel" }
pm-process-runner = { path = "crates/pm-process-runner" }
pm-vault = { path = "crates/pm-vault" }
pm-interface = { path = "crates/pm-interface" }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustls = { version = "=0.23.44", default-features = false, features = ["aws_lc_rs", "std"] }
russh = { version = "=0.63.3", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "=1.9.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.dev.package."libsodium-sys-stable:1.24.0"]
opt-level = 2
