name: Ticket 27 Windows custody

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run only the opt-in native storage-stage diagnostics (does not test product acceptance)
        required: true
        default: false
        type: boolean
      service_diagnostics:
        description: Emit fixed categorical SCM state diagnostics in the product lab (does not change product behavior)
        required: true
        default: false
        type: boolean
      tui_conpty_red:
        description: Exercise the first real normal-binary ConPTY TUI tracer (expected RED until product support exists)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  RUSTUP_AUTO_INSTALL: '0'
  RUSTUP_HOME: ${{ github.workspace }}/.toolchain/rustup
  CARGO_HOME: ${{ github.workspace }}/.toolchain/cargo
  RUSTUP_TOOLCHAIN: 1.98.1-aarch64-pc-windows-msvc

jobs:
  windows-arm64-custody:
    name: Ticket 27 windows-arm64 product
    if: ${{ inputs.diagnostic_only != true }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Install exact toolchain into repository toolchain home
        shell: pwsh
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw "Exact Rust toolchain installation failed with exit code $LASTEXITCODE" }
      - name: Verify native Windows 11 ARM64 environment
        shell: pwsh
        run: ./scripts/ci/native-preflight-windows.ps1
      - name: Fetch the locked Rust graph before offline product verification
        shell: pwsh
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Locked fetch failed with exit code $LASTEXITCODE" }
      - name: Build authenticated libsodium source with native MSVC
        shell: pwsh
        run: ./scripts/prepare-windows-libsodium.ps1 -EphemeralCI
      - name: Run native custody product lab
        shell: pwsh
        run: |
          if ('${{ inputs.service_diagnostics }}' -eq 'true') {
            if ('${{ inputs.tui_conpty_red }}' -eq 'true') {
              ./scripts/test-windows-custody-lab.ps1 -EphemeralCI -ServiceDiagnostics -TuiConPtyRed
            }
            else {
              ./scripts/test-windows-custody-lab.ps1 -EphemeralCI -ServiceDiagnostics
            }
          }
          else {
            if ('${{ inputs.tui_conpty_red }}' -eq 'true') {
              ./scripts/test-windows-custody-lab.ps1 -EphemeralCI -TuiConPtyRed
            }
            else {
              ./scripts/test-windows-custody-lab.ps1 -EphemeralCI
            }
          }

  windows-arm64-storage-diagnostics:
    name: Ticket 27 windows-arm64 storage diagnostics (non-acceptance)
    if: ${{ inputs.diagnostic_only == true }}
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - name: Run opt-in native storage-stage diagnostics
        shell: pwsh
        run: ./scripts/test-windows-storage-diagnostics.ps1 -EphemeralCI
