[package]
name = "pm-custody"
description = "Native custody process and authenticated local channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pm-custody"
path = "src/main.rs"

[[bin]]
name = "pm-passkey-bridge"
path = "src/bin/pm-passkey-bridge.rs"

[dependencies]
aws-lc-rs.workspace = true
libc.workspace = true
pm-native-channel.workspace = true
pm-crypto.workspace = true
pm-interface.workspace = true
pm-vault.workspace = true
rustls.workspace = true
russh.workspace = true
signature = "=3.0.0"
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[lints]
workspace = true
